<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Intergalactic FM</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <link rel="stylesheet" href="css/index.css?v=1782837084891">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico?v=1782837084891">
    <link rel="manifest" href="manifest.json?v=1782837084891">

    <link rel="stylesheet" href="css/index.css?v=1782837084891">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico?v=1782837084891">
    <link rel="manifest" href="manifest.json?v=1782837084891">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Intergalactic FM">
    <link rel="apple-touch-icon" href="img/logo.png?v=1782837084891">
</head>

<body>
<div class="header">
    <!-- STOP BUTTON -->
    <button id="stopButton" class="close"><svg width="20" height="20" viewBox="0 0 24 24">
        <rect width="24" height="24" fill="red"/>
    </svg></button>
    <!-- LOGO -->
    <img id="headerImage" src="img/logo.svg" alt="IFM logo">
    <!-- MENU BUTTON -->
    <button id="menuButton" class="menu-btn">≡</button>
    <!-- DROPDOWN MENU -->
    <div id="dropdownMenu" class="dropdown hidden">
        <a href="https://intergalactic.fm/" target="_blank" rel="noopener noreferrer">WEBSITE</a>
        <a href="https://www.paypal.com/donate/?hosted_button_id=MV4HVU2D4W3LJ" target="_blank" rel="noopener noreferrer">DONATE</a>
        <a href="https://hotmixxx.com/" target="_blank" rel="noopener noreferrer">ARCHIVE</a>
        <a href="https://ifmx.co" target="_blank" rel="noopener noreferrer">IFMX</a>
        <a href="https://www.instagram.com/intergalacticfm" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
        <a href="https://www.youtube.com/channel/UCyiBzmL0FAJlupsJJg5BNzQ" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
    </div>
</div>

<div class="scrollTextContainer">
    <div class="ifmxScrollText"></div>
</div>

<div id="container" class="container">
    <div class="channels">
        <button id="cbsChannelButton" class="channel">
            <div class="channelRow">
                <img class="channelIcon" src="img/cbs.png" alt="">
                <div class="channelName">CYBERNETIC BROADCASTING SYSTEM</div>
            </div>
        </button>
        <button id="dfChannelButton" class="channel">
            <div class="channelRow">
                <img class="channelIcon" src="img/df.png" alt="">
                <div class="channelName">DISCO FETISH</div>
            </div>
        </button>
        <button id="tdmChannelButton" class="channel">
            <div class="channelRow">
                <img class="channelIcon" src="img/tdm.png" alt="">
                <div class="channelName">THE DREAM MACHINE</div>
            </div>
        </button>
    </div>
    <div id="messageBox"></div>
</div>

<div id="trackInfoModal" class="modal">
    <div class="modalContent" id="modalContent">
        <h5 id="nowPlaying"></h5>
        <div id="nowPlayingExt"></div>
        <div id="nowPlayingCover"></div>
    </div>
</div>

<audio hidden id="player" src="" type="audio/mpeg" preload="auto" playsinline></audio>

<script type="module" src="js/audio.js?v=1782837084891"></script>
</body>
</html>
