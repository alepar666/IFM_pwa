<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Intergalactic FM</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <link rel="stylesheet" href="css/index.css?v=1776089669137">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico?v=1776089669137">
    <link rel="manifest" href="manifest.json?v=1776089669137">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Intergalactic FM">
    <link rel="apple-touch-icon" href="img/logo.png?v=1776089669137">
</head>

<body>
<div class="header">
    <button id="stopButton" class="close">↵</button>
    <img id="headerImage" src="img/logo.svg" alt="IFM logo">
</div>

<div class="scrollTextContainer">
    <div class="ifmxScrollText"></div>
</div>

<div id="container" class="container">
    <div class="channels">
        <button id="cbsChannelButton" class="channel">
            <div class="channelRow">
                <img class="channelIcon" src="img/cbs.png" alt="">
                <div class="channelName">CYBERNETIC BROADCASTING SYSTEM</div>
            </div>
        </button>
        <button id="dfChannelButton" class="channel">
            <div class="channelRow">
                <img class="channelIcon" src="img/df.png" alt="">
                <div class="channelName">DISCO FETISH</div>
            </div>
        </button>
        <button id="tdmChannelButton" class="channel">
            <div class="channelRow">
                <img class="channelIcon" src="img/tdm.png" alt="">
                <div class="channelName">THE DREAM MACHINE</div>
            </div>
        </button>
    </div>

    <div id="messageBox"></div>

    <div class="links">
        <button id="websiteRedirect" class="channel">@ WEBSITE</button>
        <button id="donateRedirect" class="channel">$ DONATE</button>
        <button id="archiveRedirect" class="channel">[-] ARCHIVE</button>
    </div>
</div>

<div id="trackInfoModal" class="modal">
    <div class="modalContent">
        <div id="nowPlaying"></div>
        <div id="nowPlayingExt"></div>
        <div id="nowPlayingCover"></div>
    </div>
</div>

<audio hidden id="player" src="" type="audio/mpeg" preload="auto" playsinline></audio>

<script type="module" src="js/constants.js?v=1776089669137"></script>
<script type="module" src="js/audio.js?v=1776089669137"></script>
<script type="module" src="js/index.js?v=1776089669137"></script>
</body>
</html>
